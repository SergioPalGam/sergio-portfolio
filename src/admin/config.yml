backend:
  name: github
  repo: SergioPalGam/sergio-portfolio
  branch: main
  base_url: https://sergio-portfolio-aq7.pages.dev
  auth_endpoint: api/auth
  site_domain: sergio-portfolio-aq7.pages.dev

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

editor:
  preview: false

collections:
  - name: "site"
    label: "Site"
    files:
      - label: "Theme & Typography"
        name: "theme"
        file: "src/_data/theme.json"
        format: "json"
        fields:
          - { label: "[General] Main background", name: "mainBackground", widget: "color", default: "#f7f4ec" }
          - { label: "[General] Card / surface background", name: "surfaceBackground", widget: "color", default: "#faf8f3" }
          - { label: "[General] Main text", name: "textColor", widget: "color", default: "#262320" }
          - { label: "[General] Muted text", name: "mutedColor", widget: "color", default: "#8c857d" }
          - { label: "[General] Accent color", name: "accentColor", widget: "color", default: "#d9915f" }
          - label: "[General] Primary font"
            name: "primaryFont"
            widget: "select"
            default: "avenir"
            options:
              - { label: "Avenir / Century Gothic", value: "avenir" }
              - { label: "Helvetica / Arial", value: "helvetica" }
              - { label: "Trebuchet MS", value: "trebuchet" }
              - { label: "Arial", value: "arial" }
              - { label: "Georgia", value: "georgia" }
          - label: "[General] Editorial font"
            name: "editorialFont"
            widget: "select"
            default: "georgia"
            options:
              - { label: "Georgia", value: "georgia" }
              - { label: "Times New Roman", value: "times" }
              - { label: "Avenir / Century Gothic", value: "avenir" }
              - { label: "Helvetica / Arial", value: "helvetica" }
              - { label: "Trebuchet MS", value: "trebuchet" }
          - { label: "[General] Base font size (px)", name: "baseFontSize", widget: "number", value_type: "int", min: 10, max: 24, default: 16 }
          - { label: "[General] Navigation font size (px)", name: "navFontSize", widget: "number", value_type: "int", min: 10, max: 22, default: 13 }

          - { label: "[Interface text] Header: Welcome", name: "navWelcomeLabel", widget: "string", default: "Welcome" }
          - { label: "[Interface text] Header: Tasting Menu", name: "navTastingLabel", widget: "string", default: "Tasting Menu" }
          - { label: "[Interface text] Header: Projects", name: "navProjectsLabel", widget: "string", default: "Projects" }
          - { label: "[Interface text] Header: About", name: "navAboutLabel", widget: "string", default: "About" }
          - { label: "[Interface text] Welcome button: Portfolio", name: "welcomePortfolioLabel", widget: "string", default: "Portfolio" }
          - { label: "[Interface text] Welcome button: About", name: "welcomeAboutLabel", widget: "string", default: "About" }
          - { label: "[Interface text] Welcome button: Projects", name: "welcomeProjectsLabel", widget: "string", default: "Projects" }
          - { label: "[Interface text] Shared footer label", name: "tastingFooterLabel", widget: "string", default: "say hi:" }
          - { label: "[Interface text] About clients heading", name: "aboutClientsHeading", widget: "string", default: "Clients / Selected work" }
          - { label: "[Interface text] About recognition heading", name: "aboutRecognitionHeading", widget: "string", default: "Recognition & publications" }
          - { label: "[Interface text] About email label", name: "aboutEmailLabel", widget: "string", default: "email:" }
          - { label: "[Interface text] About contact button", name: "aboutContactLabel", widget: "string", default: "Contact" }
          - { label: "[Interface text] Project Client label", name: "projectClientLabel", widget: "string", default: "Client" }
          - { label: "[Interface text] Project Project label", name: "projectProjectLabel", widget: "string", default: "Project" }
          - { label: "[Interface text] Project Role label", name: "projectRoleLabel", widget: "string", default: "Role" }

          - { label: "[Header] Height (px)", name: "headerHeight", widget: "number", value_type: "int", min: 90, max: 260, default: 178 }
          - { label: "[Header] Horizontal padding (px)", name: "headerPaddingX", widget: "number", value_type: "int", min: 20, max: 120, default: 54 }
          - { label: "[Header] Name size (px)", name: "brandNameSize", widget: "number", value_type: "int", min: 16, max: 48, default: 27 }
          - { label: "[Header] Role size (px)", name: "brandRoleSize", widget: "number", value_type: "int", min: 10, max: 30, default: 16 }
          - { label: "[Header] Navigation gap (px)", name: "navGap", widget: "number", value_type: "int", min: 10, max: 70, default: 32 }

          - { label: "[Welcome] Artwork max width (px)", name: "welcomeMaxWidth", widget: "number", value_type: "int", min: 800, max: 2600, default: 1500 }
          - { label: "[Welcome] Overlay color", name: "welcomeOverlayColor", widget: "color", default: "#d9824f" }
          - { label: "[Welcome] Overlay opacity", name: "welcomeOverlayOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.05, default: 0.3 }
          - { label: "[Welcome] Name size (px)", name: "welcomeNameSize", widget: "number", value_type: "int", min: 38, max: 96, default: 64 }
          - { label: "[Welcome] Role size (px)", name: "welcomeRoleSize", widget: "number", value_type: "int", min: 10, max: 28, default: 14 }

          - { label: "[Tasting Menu] Intro text size (px)", name: "tastingIntroSize", widget: "number", value_type: "int", min: 10, max: 24, default: 14 }
          - { label: "[Tasting Menu] Gallery gap (px)", name: "tastingGalleryGap", widget: "number", value_type: "int", min: 0, max: 40, default: 14 }
          - { label: "[Tasting Menu] Footer label size (px)", name: "tastingFooterLabelSize", widget: "number", value_type: "int", min: 10, max: 22, default: 13 }

          - { label: "[Lightbox] Background color", name: "lightboxBackground", widget: "color", default: "#181614" }
          - { label: "[Lightbox] Background opacity", name: "lightboxBackgroundOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.05, default: 0.88 }
          - { label: "[Lightbox] Arrow / close color", name: "lightboxControlColor", widget: "color", default: "#ffffff" }
          - { label: "[Lightbox] Project caption color", name: "lightboxCaptionColor", widget: "color", default: "#d4ccc2" }
          - { label: "[Lightbox] Tasting text bar color", name: "lightboxOverlayBackground", widget: "color", default: "#2b2520" }
          - { label: "[Lightbox] Tasting text bar opacity", name: "lightboxOverlayOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.05, default: 0.9 }
          - { label: "[Lightbox] Tasting text color", name: "lightboxOverlayTextColor", widget: "color", default: "#ffffff" }
          - { label: "[Lightbox] Tasting link color", name: "lightboxOverlayLinkColor", widget: "color", default: "#ffffff" }
          - { label: "[Lightbox] Tasting text size (px)", name: "lightboxOverlayFontSize", widget: "number", value_type: "int", min: 10, max: 24, default: 14 }

          - { label: "[Projects cards] Hover overlay color", name: "projectCardOverlayBackground", widget: "color", default: "#181513" }
          - { label: "[Projects cards] Hover overlay opacity", name: "projectCardOverlayOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.05, default: 0.72 }
          - { label: "[Projects cards] Hover text color", name: "projectCardOverlayTextColor", widget: "color", default: "#ffffff" }
          - { label: "[Projects cards] Project title size (px)", name: "projectCardTitleSize", widget: "number", value_type: "int", min: 10, max: 32, default: 18 }
          - { label: "[Projects cards] Project subtitle size (px)", name: "projectCardSubtitleSize", widget: "number", value_type: "int", min: 8, max: 24, default: 12 }

          - { label: "[About] Heading size (px)", name: "aboutHeadingSize", widget: "number", value_type: "int", min: 8, max: 24, default: 10 }
          - { label: "[About] List size (px)", name: "aboutListSize", widget: "number", value_type: "int", min: 10, max: 24, default: 13 }
          - { label: "[About] Biography size (px)", name: "aboutTextSize", widget: "number", value_type: "int", min: 10, max: 26, default: 14 }
          - { label: "[About] Contact button background", name: "contactButtonBackground", widget: "color", default: "#262320" }
          - { label: "[About] Contact button text", name: "contactButtonTextColor", widget: "color", default: "#faf8f3" }

          - { label: "[Project detail] Background", name: "projectBackground", widget: "color", default: "#f7f4ec" }
          - { label: "[Project detail] Text", name: "projectTextColor", widget: "color", default: "#262320" }
          - { label: "[Project detail] Meta label color", name: "projectLabelColor", widget: "color", default: "#d9915f" }
          - { label: "[Project detail] Text size (px)", name: "projectFontSize", widget: "number", value_type: "int", min: 12, max: 28, default: 16 }
          - { label: "[Project detail] Image caption size (px)", name: "captionFontSize", widget: "number", value_type: "int", min: 10, max: 22, default: 14 }
          - { label: "[Project detail] Media card background", name: "projectMediaBackground", widget: "color", default: "#faf8f3" }
          - { label: "[Project detail] Text card background", name: "projectTextCardBackground", widget: "color", default: "#faf8f3" }
          - { label: "[Project detail] Text card text", name: "projectTextCardTextColor", widget: "color", default: "#262320" }
          - { label: "[Project detail] Text card title size (px)", name: "projectTextCardTitleSize", widget: "number", value_type: "int", min: 12, max: 48, default: 22 }
          - { label: "[Project detail] Text card body size (px)", name: "projectTextCardBodySize", widget: "number", value_type: "int", min: 10, max: 28, default: 15 }

      - label: "Welcome, Tasting Menu & About"
        name: "portfolio"
        file: "src/_data/portfolio.json"
        format: "json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - label: "Welcome"
            name: "welcome"
            widget: "object"
            fields:
              - { label: "Seconds per image", name: "secondsPerImage", widget: "number", value_type: "int", min: 1, default: 5 }
              - label: "Background images"
                name: "images"
                widget: "list"
                allow_add: true
                field: { label: "Image", name: "image", widget: "image", required: false }
          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Tasting Menu intro"
            name: "tastingIntro"
            widget: "object"
            required: false
            fields:
              - { label: "Short description", name: "text", widget: "string", required: false, default: "A selection of visual development, character design and illustration work." }
              - { label: "Project link text", name: "linkText", widget: "string", required: false, default: "View full projects" }
              - { label: "Project link URL", name: "linkUrl", widget: "string", required: false, default: "/projects/" }
          - label: "Tasting Menu"
            name: "tasting"
            widget: "list"
            allow_add: true
            collapsed: false
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - { label: "Expanded image description", name: "hoverText", widget: "text", required: false, hint: "Shown in the dark bar only when hovering over the expanded lightbox image." }
              - { label: "Expanded image link text", name: "hoverLinkText", widget: "string", required: false }
              - { label: "Expanded image link URL", name: "hoverLinkUrl", widget: "string", required: false }
              - label: "Placeholder shape"
                name: "shape"
                widget: "select"
                default: "square"
                options:
                  - { label: "Wide", value: "wide" }
                  - { label: "Portrait", value: "portrait" }
                  - { label: "Square", value: "square" }
                  - { label: "Tall", value: "tall" }
                  - { label: "Banner", value: "banner" }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Portrait", name: "portrait", widget: "image", required: false }
              - label: "Clients / Selected work"
                name: "clients"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "Recognition & publications"
                name: "recognition"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "Biography paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{order}} · {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", min: 1, default: 1 }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Project logo", name: "logo", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Default gallery card height (px)", name: "defaultCardHeight", widget: "number", value_type: "int", min: 160, max: 1200, required: false, hint: "Optional. Sets one shared media height for this project. Leave empty to keep natural image heights. Each card can override it." }
      - label: "Project cards"
        name: "images"
        widget: "list"
        allow_add: true
        collapsed: false
        summary: "{{fields.type}} · {{fields.textTitle}} {{fields.caption}}"
        fields:
          - label: "Card type"
            name: "type"
            widget: "select"
            default: "image"
            options:
              - { label: "Image", value: "image" }
              - { label: "Text only", value: "text" }
              - { label: "Video", value: "video" }
          - { label: "[Image] Image", name: "image", widget: "image", required: false }
          - { label: "[Video] Video file", name: "video", widget: "file", required: false, hint: "Upload a web video file such as MP4/WebM. Keep each file under Cloudflare Pages' asset-size limit." }
          - { label: "[Video] Poster image", name: "poster", widget: "image", required: false }
          - { label: "[Text] Title", name: "textTitle", widget: "string", required: false }
          - { label: "[Text] Body", name: "textBody", widget: "text", required: false }
          - label: "[Text] Alignment"
            name: "textAlign"
            widget: "select"
            default: "left"
            required: false
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Right", value: "right" }
          - { label: "Caption (image/video)", name: "caption", widget: "text", required: false }
          - label: "Width / layout"
            name: "layout"
            widget: "select"
            default: "half"
            options:
              - { label: "Full width", value: "full" }
              - { label: "Half width (2 per row)", value: "half" }
              - { label: "Third width (3 per row)", value: "third" }
              - { label: "Quarter width (4 per row)", value: "quarter" }
          - { label: "Card height override (px)", name: "height", widget: "number", value_type: "int", min: 120, max: 1400, required: false, hint: "Optional. Overrides the project's default height for this card. Leave empty for the project default or natural height." }
          - label: "Image/video fit"
            name: "fit"
            widget: "select"
            default: "cover"
            required: false
            options:
              - { label: "Cover — fill card and crop edges", value: "cover" }
              - { label: "Contain — show complete media", value: "contain" }
