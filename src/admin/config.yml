backend:
  name: github
  repo: SergioPalGam/sergio-portfolio
  branch: main
  base_url: https://sergio-portfolio-aq7.pages.dev
  auth_endpoint: api/auth
  site_domain: sergio-portfolio-aq7.pages.dev

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

editor:
  preview: false

collections:
  - name: "site"
    label: "Site"
    files:
      - label: "Theme & Typography"
        name: "theme"
        file: "src/_data/theme.json"
        format: "json"
        fields:
          - { label: "Main background", name: "mainBackground", widget: "color", default: "#f7f4ec" }
          - { label: "Card / surface background", name: "surfaceBackground", widget: "color", default: "#faf8f3" }
          - { label: "Main text", name: "textColor", widget: "color", default: "#262320" }
          - { label: "Muted text", name: "mutedColor", widget: "color", default: "#8c857d" }
          - { label: "Accent color", name: "accentColor", widget: "color", default: "#d9915f" }
          - { label: "Project background", name: "projectBackground", widget: "color", default: "#d5cfc6" }
          - { label: "Project text", name: "projectTextColor", widget: "color", default: "#3d3935" }
          - { label: "Welcome overlay color", name: "welcomeOverlayColor", widget: "color", default: "#d9824f" }
          - { label: "Welcome overlay opacity", name: "welcomeOverlayOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.05, default: 0.3 }
          - { label: "Welcome artwork max width (px)", name: "welcomeMaxWidth", widget: "number", value_type: "int", min: 800, max: 2400, default: 1500 }
          - label: "Primary font"
            name: "primaryFont"
            widget: "select"
            default: "avenir"
            options:
              - { label: "Avenir / Century Gothic", value: "avenir" }
              - { label: "Helvetica / Arial", value: "helvetica" }
              - { label: "Trebuchet MS", value: "trebuchet" }
              - { label: "Arial", value: "arial" }
              - { label: "Georgia", value: "georgia" }
          - label: "Editorial font"
            name: "editorialFont"
            widget: "select"
            default: "georgia"
            options:
              - { label: "Georgia", value: "georgia" }
              - { label: "Times New Roman", value: "times" }
              - { label: "Avenir / Century Gothic", value: "avenir" }
              - { label: "Helvetica / Arial", value: "helvetica" }
              - { label: "Trebuchet MS", value: "trebuchet" }
          - { label: "Base font size (px)", name: "baseFontSize", widget: "number", value_type: "int", min: 12, max: 24, default: 16 }
          - { label: "Navigation font size (px)", name: "navFontSize", widget: "number", value_type: "int", min: 10, max: 20, default: 13 }
          - { label: "Welcome name size (px)", name: "welcomeNameSize", widget: "number", value_type: "int", min: 38, max: 96, default: 64 }
          - { label: "Welcome role size (px)", name: "welcomeRoleSize", widget: "number", value_type: "int", min: 10, max: 28, default: 14 }
          - { label: "Project text size (px)", name: "projectFontSize", widget: "number", value_type: "int", min: 12, max: 24, default: 16 }
          - { label: "Image caption size (px)", name: "captionFontSize", widget: "number", value_type: "int", min: 10, max: 20, default: 14 }

      - label: "Welcome, Tasting Menu & About"
        name: "portfolio"
        file: "src/_data/portfolio.json"
        format: "json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - label: "Welcome"
            name: "welcome"
            widget: "object"
            fields:
              - { label: "Seconds per image", name: "secondsPerImage", widget: "number", value_type: "int", min: 1, default: 5 }
              - label: "Background images"
                name: "images"
                widget: "list"
                allow_add: true
                field: { label: "Image", name: "image", widget: "image", required: false }
          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Tasting Menu intro"
            name: "tastingIntro"
            widget: "object"
            required: false
            fields:
              - { label: "Short description", name: "text", widget: "string", required: false, default: "A selection of visual development, character design and illustration work." }
              - { label: "Project link text", name: "linkText", widget: "string", required: false, default: "View full projects" }
              - { label: "Project link URL", name: "linkUrl", widget: "string", required: false, default: "/projects/" }
          - label: "Tasting Menu"
            name: "tasting"
            widget: "list"
            allow_add: true
            collapsed: false
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - label: "Placeholder shape"
                name: "shape"
                widget: "select"
                default: "square"
                options:
                  - { label: "Wide", value: "wide" }
                  - { label: "Portrait", value: "portrait" }
                  - { label: "Square", value: "square" }
                  - { label: "Tall", value: "tall" }
                  - { label: "Banner", value: "banner" }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Portrait", name: "portrait", widget: "image", required: false }
              - label: "Clients / Selected work"
                name: "clients"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "Recognition & publications"
                name: "recognition"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "Biography paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{order}} · {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", min: 1, default: 1 }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Project logo", name: "logo", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Project images"
        name: "images"
        widget: "list"
        allow_add: true
        collapsed: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Caption", name: "caption", widget: "text", required: false }
          - label: "Layout"
            name: "layout"
            widget: "select"
            default: "half"
            options:
              - { label: "Full width", value: "full" }
              - { label: "Half width (2 per row)", value: "half" }
              - { label: "Third width (3 per row)", value: "third" }
              - { label: "Quarter width (4 per row)", value: "quarter" }
